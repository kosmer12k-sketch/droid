name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Patch missing ZRLEEncoding and import
        run: |
          mkdir -p rfbcore/src/main/java/app/razar/rfbcore/encodings
          if [ ! -f rfbcore/src/main/java/app/razar/rfbcore/encodings/ZRLEEncoding.kt ]; then
            cat << 'EOF' > rfbcore/src/main/java/app/razar/rfbcore/encodings/ZRLEEncoding.kt
          package app.razar.rfbcore.encodings

          open class ZRLEEncoding
          EOF
          fi
          
          sed -i 's/package app.razar.rfbcore/package app.razar.rfbcore\nimport app.razar.rfbcore.encodings.ZRLEEncoding/' rfbcore/src/main/java/app/razar/rfbcore/VNCImpl.kt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
