name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Apply all fixes for ZRLEEncoding
        run: |
          ENC_DIR="rfbcore/src/main/java/app/razar/rfbcore/encodings"
          mkdir -p "$ENC_DIR"

          # 1. Создаем класс ZRLEEncoding с наследованием от Encoding и реализацией encodingId
          cat << 'EOF' > "$ENC_DIR/ZRLEEncoding.kt"
          package app.razar.rfbcore.encodings

          open class ZRLEEncoding : Encoding() {
              override val encodingId: Int = 16
          }
          EOF

          # 2. Добавляем недостающий import в VNCImpl.kt (если его еще нет)
          VNC_FILE="rfbcore/src/main/java/app/razar/rfbcore/VNCImpl.kt"
          if ! grep -q "import app.razar.rfbcore.encodings.ZRLEEncoding" "$VNC_FILE"; then
            sed -i 's/package app.razar.rfbcore/package app.razar.rfbcore\nimport app.razar.rfbcore.encodings.ZRLEEncoding/' "$VNC_FILE"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
