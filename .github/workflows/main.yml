name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Apply all fixes for ZRLEEncoding
        run: |
          ENC_DIR="rfbcore/src/main/java/app/razar/rfbcore/encodings"
          mkdir -p "$ENC_DIR"

          # Находим точные импорты для Render и ByteReadChannel из файла Encoding.kt
          ENC_FILE=$(find "$ENC_DIR" -name "Encoding.kt" | head -n 1)
          IMPORTS=$(grep "^import " "$ENC_FILE" || true)

          # Создаем полноценный класс ZRLEEncoding, реализующий интерфейс Encoding
          cat << EOF > "$ENC_DIR/ZRLEEncoding.kt"
          package app.razar.rfbcore.encodings

          $IMPORTS

          open class ZRLEEncoding : Encoding {
              override val encodingId: Int = 16

              override suspend fun decode(
                  render: Render,
                  dataInputStream: ByteReadChannel,
                  width: Int,
                  height: Int,
                  xPosition: Int,
                  yPosition: Int
              ) {
                  // Заглушка для отсутствующего в репозитории декодера ZRLE
              }
          }
          EOF

          # Добавляем недостающий import в VNCImpl.kt (если его еще нет)
          VNC_FILE="rfbcore/src/main/java/app/razar/rfbcore/VNCImpl.kt"
          if ! grep -q "import app.razar.rfbcore.encodings.ZRLEEncoding" "$VNC_FILE"; then
            sed -i 's/package app.razar.rfbcore/package app.razar.rfbcore\nimport app.razar.rfbcore.encodings.ZRLEEncoding/' "$VNC_FILE"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
